site_name: IC2 Refactored Documentation
site_description: Add-on API documentation for IndustrialCraft 2 Refactored on Minecraft 1.21.1 and NeoForge.
site_url: https://lerrche.github.io/IC2-Refactored-Rebranded/
repo_url: https://github.com/Lerrche/IC2-Refactored-Rebranded
repo_name: Lerrche/IC2-Refactored-Rebranded
edit_uri: edit/main/docs/

copyright: Unofficial community documentation for IC2 Refactored.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: slate
      primary: amber
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: brown
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Registration: registration.md
  - Examples:
      - Overview: examples/index.md
      - Register Items and Blocks: examples/registration.md
      - Electric Item: examples/electric-item.md
      - Electric Weapon: examples/electric-weapon.md
      - Generator Base: examples/generator.md
  - Energy API:
      - Overview: energy/index.md
      - Storage Block Entities: energy/storage.md
      - Generators: energy/generators.md
  - Electric Items:
      - Electric Items and Batteries: items/electric-items.md
      - Armor and Jetpacks: items/armor.md
  - API Reference: api-reference.md
  - Compatibility: compatibility.md
  - Building the Mod: building.md
  - Contributing: contributing.md
