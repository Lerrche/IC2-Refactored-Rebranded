site_name: IC2 Refactored Add-on API
site_description: Developer documentation for the IC2 Refactored add-on API on Minecraft 1.21.1 and NeoForge.
site_url: https://lerche.github.io/IC2-Refactored-Rebranded/
repo_url: https://github.com/Lerrche/IC2-Refactored-Rebranded
repo_name: Lerrche/IC2-Refactored-Rebranded
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Content registration: registration.md
  - Energy:
      - Overview: energy/index.md
      - Energy storage: energy/storage.md
      - Generators: energy/generators.md
  - Electric items:
      - Electric items and weapons: items/electric-items.md
      - Armor and jetpacks: items/armor.md
  - API reference: api-reference.md
  - Compatibility and troubleshooting: compatibility.md
